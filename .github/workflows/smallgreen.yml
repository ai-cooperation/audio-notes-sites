name: smallgreen

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: smallgreen-cloud/spec
          path: .smallgreen-spec
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml
      - name: Validate SmallGreen contracts
        env:
          SMALLGREEN_SPEC_PATH: ${{ github.workspace }}/.smallgreen-spec
        run: python -m unittest tests/test_smallgreen_contract.py

